<script>
   b_usuario.innerHTML = sessionStorage.NOME_USUARIO;

    let proximaAtualizacao;

    window.onload = obterDadosGrafico();

    function obterDadosGrafico() {
        if (proximaAtualizacao != undefined) {
            clearTimeout(proximaAtualizacao);
        }

        fetch(`/usuarios/buscarAcessos`, { cache: 'no-store' }).then(function (response) {
            if (response.ok) {
                response.json().then(function (resposta) {
                    console.log(`Dados recebidos: ${JSON.stringify(resposta)}`);
                    plotarGrafico(resposta);
                });
            } else {
                console.error('Nenhum dado encontrado ou erro na API');
            }
        })
        .catch(function (error) {
            console.error(`Erro na obtenção dos dados p/ gráfico: ${error.message}`);
        });
    }

    function plotarGrafico(resposta) {
        console.log('iniciando plotagem do gráfico...');

        let labels = [];
        let dados = {
            labels: labels,
            datasets: [{
                label: 'Acessos por Dia',
                data: [],
                fill: true,
                borderColor: '#e6005a', 
                backgroundColor: '#e6005a33',
                tension: 0.3
            }]
        };

        for (i = 0; i < resposta.length; i++) {
            var registro = resposta[i];
            labels.push(registro.dia);
            dados.datasets[0].data.push(registro.qtd);
        }

        const config = {
            type: 'line',
            data: dados,
            options: {
                scales: {
                    y: { beginAtZero: true }
                }
            }
        };

        let myChart = new Chart(
            document.getElementById(`canvas_grafico_acessos`),
            config
        );

        setTimeout(() => atualizarGrafico(dados, myChart), 2000);
    }

    function atualizarGrafico(dados, myChart) {
        fetch(`/usuarios/buscarAcessos`, { cache: 'no-store' }).then(function (response) {
            if (response.ok) {
                response.json().then(function (novoRegistro) {

                    var ultimoRegistro = novoRegistro[novoRegistro.length - 1];

                    console.log(`Dados recebidos: ${JSON.stringify(novoRegistro)}`);
                    
                    if (ultimoRegistro.dia == dados.labels[dados.labels.length - 1]) {
                        console.log("Sem dados novos.");
                    } else {
                        dados.labels.shift();
                        dados.labels.push(ultimoRegistro.dia);

                        dados.datasets[0].data.shift();
                        dados.datasets[0].data.push(ultimoRegistro.qtd);

                        myChart.update();
                    }

                    proximaAtualizacao = setTimeout(() => atualizarGrafico(dados, myChart), 2000);
                });
            } else {
                console.error('Erro na atualização');
                proximaAtualizacao = setTimeout(() => atualizarGrafico(dados, myChart), 2000);
            }
        })
        .catch(function (error) {
            console.error(`Erro na atualização: ${error.message}`);
        });
    }
</script>
